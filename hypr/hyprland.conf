################
### MONITORS ###
################

source = ~/.config/hypr/monitors.conf

###################
### MY PROGRAMS ###
###################
$terminal = kitty
$fileManager = nautilus
$menu = rofi -show drun
$browser = firefox

#################
### AUTOSTART ###
#################
exec-once = swaync &
exec-once = blueman-applet &
exec-once = nm-applet --indicator &
exec-once = waybar &
exec-once = hyprpaper &
exec-once = xwaylandvideobridge &
exec-once = hyprtcl setcursor Qogir-Dark 24
exec-once = hypridle
exec-once = hyprsunset --temperature 5000K

#############################
### ENVIRONMENT VARIABLES ###
#############################
# Establece el tema y tamaño del cursor para Hyprland (aplicaciones Wayland)
env = HYPRCURSOR_THEME,Qogir-Dark
env = HYPRCURSOR_SIZE,24

xwayland {
    force_zero_scaling = true
}

# Establece el tema y tamaño para aplicaciones XWayland (como muchos navegadores, Steam, etc.)
env = XCURSOR_THEME,Qogir-Dark
env = XCURSOR_SIZE,24

env = BROWSER, firefox

###################
### PERMISSIONS ##
# Puedes descomentar y ajustar si usas permisos específicos
# ecosystem {
#   enforce_permissions = 1
# }
# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 2
    gaps_out = 5
    border_size = 2
    col.active_border = rgba(155,147,147,0.45)
    col.inactive_border = rgba(255,255,255,0)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 7
    rounding_power = 2
    active_opacity = 2.0
    inactive_opacity = 1.0
    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    blur {
        enabled = false
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    bezier = slider,0.075,0.82,0.165,1
    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 7, slider, slide
    animation = workspacesIn, 1, 7, slider, slide
    animation = workspacesOut, 1, 7, slider, slide
}

#gestures {
#   workspace_swipe = true
#   workspace_swipe_fingers = 3
#}

#dwindle {
#    pseudotile = true
#    preserve_split = true
#}

master {
    new_status = master
}

misc {
    vrr = 0
    force_default_wallpaper = -1
    disable_hyprland_logo = true
}

#############
### INPUT ###
#############
cursor {
    no_hardware_cursors = 0
}

input {
    kb_layout = latam
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
	disable_while_typing = true
	clickfinger_behavior = true
    }
}

gestures {
}

device {
    name = epic-mouse-v1
    sensitivity = 0
}

###################
### KEYBINDINGS ###
###################
$mainMod = SUPER

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, C, killactive
bind = $mainMod, L, exit
bind = $mainMod, F, fullscreen
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo
#bind = $mainMod, J, togglesplit
bind = $mainMod SHIFT, Ñ, exec, hyprshot -m window --clipboard-only && notify-send "Captura de pantalla" "Ventana guardada en el portapapeles"
bind = $mainMod SHIFT, I, exec, hyprshot -m region --clipboard-only && notify-send "Captura de pantalla" "Región guardada en el portapapeles"
bind = $mainMod SHIFT , A, exec, xdg-open 'https://aula.usm.cl/'
bind = $mainMod SHIFT , W, exec, xdg-open 'https://web.whatsapp.com/'
bind = $mainMod SHIFT , O, exec, xdg-open 'https://outlook.office.com/mail/inbox/id/AAQkAGE5MDhhYWFiLWVlODktNDAzYi1hODAxLTMxNDg3YzNkN2IwZAAQAFPQDcmBR3VIgBQj%2BrvtTSI%3D'


bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, left, workspace, e-1
bind = $mainMod, right, workspace, e+1


bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################
windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = opacity 0.0 override, class:^(xwaylandvideobridge)$
windowrulev2 = noanim, class:^(xwaylandvideobridge)$
windowrulev2 = noinitialfocus, class:^(xwaylandvideobridge)$
windowrulev2 = maxsize 1 1, class:^(xwaylandvideobridge)$
windowrulev2 = noblur, class:^(xwaylandvideobridge)$
